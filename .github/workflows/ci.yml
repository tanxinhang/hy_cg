name: simulator-ci

on:
  push:
  pull_request:

jobs:
  unit-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: python -m pip install --upgrade numpy matplotlib pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Target-local smoke experiment
        run: >-
          python run_isac_sim.py --mode main --preset target-local-v1
          --mc 2 --workers 1 --out ci-smoke --no-plots --quiet
          --methods proposed_c2f_adaptive_pd proposed_c2f_full_pd
          exact_marginal_greedy sense_sinr
          --paired-reference proposed_c2f_adaptive_pd

  release-gate:
    runs-on: ubuntu-latest
    needs: unit-and-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gate dependency
        run: python -m pip install --upgrade numpy
      - name: Validate checked-in V1 result contract
        run: python tools/check_target_local_v1.py results_target_local_v1/main

  # ------------------------------------------------------------------
  # Environment-independent gates.  These are the ones CI *can* run:
  # they compare the tree against contracts stored in the tree, so they
  # need no local baseline and no specific BLAS.
  #
  # The two bit-exact gates (`parity_check.py --baseline/--release-baseline
  # --strict`) are deliberately absent.  Their baselines live under
  # `.workbuddy/`, which `.gitignore` excludes, so a runner has nothing to
  # compare against -- and they are environment-bound anyway: py3.13/numpy
  # 2.5.2 shows ~25 sub-1e-12 cell differences on identical code.  They stay
  # a local pre-commit gate.  The step below states that explicitly so a
  # green CI run is never mistaken for "the released numbers are pinned".
  # ------------------------------------------------------------------
  frozen-gates:
    runs-on: ubuntu-latest
    needs: unit-and-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin numpy to the release environment
        run: python -m pip install --upgrade "numpy==2.2.6"
      - name: Release identity (96 frozen keys, 0 violations)
        run: python tools/check_release_identity.py --check
      - name: Contract references (file + range + required symbol)
        run: python tools/check_contract_refs.py
      - name: TP-UIC receiver contract
        run: >-
          python -m pytest -q
          tests/test_cancellation_tp_uic.py
          tests/test_cancellation_glrt.py
      - name: State what CI does not cover
        run: |
          echo "::notice title=Local-only gates::parity_check.py --baseline \
          --strict and --release-baseline --strict are NOT run here: their \
          baselines live under the gitignored .workbuddy/, and the comparison \
          is interpreter/numpy-bound. Run them locally before tagging."

