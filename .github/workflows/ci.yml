name: simulator-ci

on:
  push:
  pull_request:

jobs:
  unit-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: python -m pip install --upgrade numpy matplotlib pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Target-local smoke experiment
        run: >-
          python run_isac_sim.py --mode main --preset target-local-v1
          --mc 2 --workers 1 --out ci-smoke --no-plots --quiet
          --methods proposed_c2f_adaptive_pd proposed_c2f_full_pd
          exact_marginal_greedy sense_sinr
          --paired-reference proposed_c2f_adaptive_pd

  release-gate:
    runs-on: ubuntu-latest
    needs: unit-and-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gate dependency
        run: python -m pip install --upgrade numpy
      - name: Validate checked-in V1 result contract
        run: python tools/check_target_local_v1.py results_target_local_v1/main
